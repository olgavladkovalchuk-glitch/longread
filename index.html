    const DeskComponent = ({ desk, onClueFound, onInteraction, interactedHotspots, selectedClue, setSelectedClue }) => {
        const [selectedHotspot, setSelectedHotspot] = useState(null);
        const [interactionResult, setInteractionResult] = useState(null);
        const [imageError, setImageError] = useState(false);

        const handleHotspotClick = (hotspot) => {
            if (selectedClue) {
                const useInteraction = hotspot.use?.find(u => u.clueId === selectedClue);
                if (useInteraction) {
                    setInteractionResult(useInteraction.result);
                    if (useInteraction.newClue) {
                        onClueFound(useInteraction.newClue, useInteraction.time, hotspot.id + '_used');
                    } else {
                        onInteraction(useInteraction.time, hotspot.id + '_used');
                    }
                } else {
                    setInteractionResult("Это не работает.");
                }
                setSelectedHotspot(hotspot);
                setSelectedClue(null);
                return;
            }

            if (interactedHotspots.has(hotspot.id)) {
                setInteractionResult("Вы уже осмотрели этот предмет.");
                setSelectedHotspot(hotspot);
            } else {
                setSelectedHotspot(hotspot);
                setInteractionResult(null);
            }
        };

        const handleInteractionChoice = (type) => {
            if (!selectedHotspot) return;

            const interaction = selectedHotspot.interactions[type];
            setInteractionResult(interaction.result);

            if ('clue' in interaction && interaction.clue) {
                onClueFound(interaction.clue, interaction.time, selectedHotspot.id);
            } else {
                onInteraction(interaction.time, selectedHotspot.id);
            }
        };

        const closeModal = () => {
            setSelectedHotspot(null);
            setInteractionResult(null);
        };

        return (
            <div className="relative w-full max-w-4xl mx-auto border-4 border-[#333] bg-[#222]">
                {!imageError ? (
                    <img
                        src={desk.imageUrl}
                        alt={desk.name}

                    {desk.hotspots.map(hotspot => (
                        <div
                            key={hotspot.id}
                            className="absolute hotspot"
                            style={{
                                top: hotspot.top,
                                left: hotspot.left,
                                width: hotspot.width,
                                height: hotspot.height,
                            }}
                            onClick={() => handleHotspotClick(hotspot)}
                            title={hotspot.description}
                        />
                    ))}
                </div>

                <Modal isOpen={!!selectedHotspot} onClose={closeModal} title={selectedHotspot?.description || ''}>
                    {selectedHotspot && (
                        <div>
                            {interactionResult ? (
                                <div>
                                    <p className="mb-4 p-4 bg-gray-200/50 border-l-4 border-[#4E6851]">{interactionResult}</p>
                                    <button onClick={closeModal} className="w-full bg-[#333] text-white py-2 px-6 font-bold hover:bg-black transition-all duration-200 transform active:scale-95">Закрыть</button>
                                </div>
                            ) : (
                                <div className="flex flex-col gap-4">
                                    <button onClick={() => handleInteractionChoice('quick')} className="w-full bg-[#4E6851] text-white py-2 px-6 font-bold hover:bg-[#3e5341] transition-all duration-200 transform active:scale-95">
                                        {selectedHotspot.interactions.quick.text}
                                    </button>
                                    <button onClick={() => handleInteractionChoice('deep')} className="w-full bg-[#B83A2D] text-white py-2 px-6 font-bold hover:bg-[#9c3025] transition-all duration-200 transform active:scale-95">
                                        {selectedHotspot.interactions.deep.text}
                                    </button>
                                </div>
                            )}
                        </div>
                    )}
                </Modal>
            </div>
        );
    };

    const SearchSection = ({ timeLeft, foundClues, foundCluesCount, onClueFound, onInteraction, interactedHotspots, onComplete }) => {

        };

            setSelectedClue(prev => prev === clueId ? null : clueId);

    const InterrogationSection = ({ foundClues, onComplete, onNoteAdded }) => {
        const [activeSuspect, setActiveSuspect] = useState(SuspectId.Grigory);
        const [dialogueHistory, setDialogueHistory] = useState({
            grigory: [],
            elena: [],

        const handleQuestion = (question, answer, conclusion) => {
            setDialogueHistory(prev => ({
                ...prev,
                [activeSuspect]: [...prev[activeSuspect], { question, answer }]
            }));
            onNoteAdded(`${activeSuspect.toUpperCase()}: ${conclusion}`);
        };

        const handleSuspectChange = (suspectId) => {
            setActiveSuspect(suspectId);
        }

        const dialogues = INTERROGATION_DIALOGUES[activeSuspect];
        const currentSuspectImage = SUSPECTS.find(s => s.id === activeSuspect)?.imageUrl;
        const answeredQuestions = new Set(dialogueHistory[activeSuspect].map(d => d.question));

        return (
            <section id="interrogation">
                <h2 className="text-xl font-bold mb-4 font-mono">ДОПРОС</h2>
                <div className="flex justify-center border-b-2 border-gray-500/50 mb-4">
                    {SUSPECTS.map(suspect => (
                        <button
                            key={suspect.id}
                            onClick={() => handleSuspectChange(suspect.id)}
                            className={`py-2 px-6 font-mono font-bold transition-all duration-200 transform active:scale-95 ${activeSuspect === suspect.id ? 'bg-[#4E6851] text-white' : 'bg-transparent hover:bg-gray-400/20'}`}
                        >
                            {suspect.name.toUpperCase()}
                        </button>
                    ))}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="md:col-span-1">
                        <img src={currentSuspectImage} alt={activeSuspect} className="w-full h-auto object-cover object-top border-2 border-black" />
                    </div>
                    <div className="md:col-span-2">
                        <div className="bg-white/50 p-4 border border-gray-500/20 h-64 overflow-y-auto mb-4">
                            {dialogueHistory[activeSuspect].length === 0 && <p className="text-gray-500">Начните допрос, выбрав вопрос...</p>}
                            {dialogueHistory[activeSuspect].map((entry, index) => (
                                <div key={index} className="mb-4">
                                    <p className="font-bold text-[#4E6851]">Вы: <span className="font-normal text-black">{entry.question}</span></p>
                                    <p className="font-bold text-[#B83A2D]">{activeSuspect.charAt(0).toUpperCase() + activeSuspect.slice(1)}: <span className="font-normal text-black">{entry.answer}</span></p>
                                </div>
                            ))}
                        </div>
                        <div className="space-y-2">
                            {dialogues.map(dialogue => {
                                const isAvailable = !dialogue.requiresClue || foundClues.has(dialogue.requiresClue);
                                const isAnswered = answeredQuestions.has(dialogue.question);

                                return (
                                    <button
                                        key={dialogue.id}
                                        onClick={() => handleQuestion(dialogue.question, dialogue.answer, dialogue.conclusion)}
                                        disabled={!isAvailable || isAnswered}
                                        className={`w-full text-left p-2 border transition-all duration-200 transform active:scale-95 ${
                                            isAnswered ? 'bg-gray-300 text-gray-500 cursor-not-allowed' :
                                            isAvailable ? 'bg-white hover:bg-gray-200' : 'bg-gray-100 text-gray-400 cursor-not-allowed'
                                        }`}
                                        title={!isAvailable ? 'Требуется улика' : ''}
                                    >
                                        {dialogue.question}
                                        {!isAvailable && <span className="text-xs text-red-500 ml-2">(Требуется предмет/улика)</span>}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>

                <div className="text-center mt-8">
                    <button onClick={onComplete} className="bg-[#333] text-white py-2 px-12 font-bold hover:bg-black transition-all duration-200 font-mono transform active:scale-95">
                        &gt;&gt; ВЫНЕСТИ ВЕРДИКТ
                    </button>
                </div>
            </section>
        );
    };

    const DeductionSection = ({ onComplete, notebookEntries }) => {
        const [culprit, setCulprit] = useState('');
        const [method, setMethod] = useState('');
        const [motive, setMotive] = useState('');
        const [isNotebookOpen, setIsNotebookOpen] = useState(false);

        const handleSubmit = () => {
            onComplete(culprit, method, motive);
        };

        return (
            <section id="deduction">
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-bold font-mono">ДЕДУКЦИЯ</h2>
                    <button
                        onClick={() => setIsNotebookOpen(true)}
                        className="bg-[#f0e6d2] border-2 border-black px-4 py-2 font-bold font-mono hover:bg-[#e6dfcc] transition-colors shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-x-1 active:translate-y-1"
                    >
                        ОТКРЫТЬ БЛОКНОТ
                    </button>
                </div>

                <p className="mb-6">Проанализировав улики и показания, вы готовы вынести окончательный вердикт. Выберите виновного, способ утечки и мотив преступления.</p>

                <div className="bg-white/40 p-6 border border-gray-400 mb-8">
                    <div className="grid grid-cols-1 gap-6">
                        <div>
                            <label htmlFor="culprit" className="block font-bold mb-2 text-lg">1. КТО ВИНОВАТ?</label>
                            <select id="culprit" value={culprit} onChange={e => setCulprit(e.target.value)} className="w-full p-3 border-2 border-black bg-white font-mono text-lg cursor-pointer hover:bg-gray-50">
                                <option value="">-- Выберите подозреваемого --</option>
                                <option value="grigory">Григорий (Сисадмин)</option>
                                <option value="elena">Елена (Менеджер)</option>
                                <option value="mikhail">Михаил (Главбух)</option>
                            </select>
                        </div>
                        <div>
                            <label htmlFor="method" className="block font-bold mb-2 text-lg">2. КАК СЛИЛИ ДАННЫЕ?</label>
                            <select id="method" value={method} onChange={e => setMethod(e.target.value)} className="w-full p-3 border-2 border-black bg-white font-mono text-lg cursor-pointer hover:bg-gray-50">
                                <option value="">-- Выберите метод --</option>
                                <option value="phishing">Фишинг / Шантаж / Соц. инженерия</option>
                                <option value="hack">Прямой взлом сервера (Брутфорс)</option>
                                <option value="insider">Халатность / Случайная утечка</option>
                            </select>
                        </div>
                        <div>
                            <label htmlFor="motive" className="block font-bold mb-2 text-lg">3. КАКОЙ БЫЛ МОТИВ?</label>
                            <select id="motive" value={motive} onChange={e => setMotive(e.target.value)} className="w-full p-3 border-2 border-black bg-white font-mono text-lg cursor-pointer hover:bg-gray-50">
                                <option value="">-- Выберите мотив --</option>
                                <option value="revenge">Месть компании за обиды</option>
                                <option value="stupidity">Глупость / Некомпетентность</option>
                                <option value="debt">Финансовые проблемы / Долги</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div className="text-center">
                    <button
                        onClick={handleSubmit}
                        disabled={!culprit || !method || !motive}
                        className="bg-[#B83A2D] text-white py-4 px-16 font-bold text-xl hover:bg-[#9c3025] transition-all duration-200 font-mono transform active:scale-95 disabled:bg-gray-400 disabled:cursor-not-allowed shadow-xl border-4 border-[#8b0000]"
                    >
                        ВЫНЕСТИ ПРИГОВОР
                    </button>
                </div>

                {/* Notebook Modal */}
                <Modal isOpen={isNotebookOpen} onClose={() => setIsNotebookOpen(false)} title="БЛОКНОТ ДЕТЕКТИВА">
                     <div className="bg-yellow-50 p-4 border border-gray-200 min-h-[300px] max-h-[60vh] overflow-y-auto font-mono text-sm leading-relaxed">
                        {notebookEntries.length === 0 ? (
                            <p className="text-gray-500 italic text-center mt-10">Вы пока не сделали никаких важных заметок во время допроса.</p>
                        ) : (
                            <ul className="list-disc list-inside space-y-3">
                                {notebookEntries.map((note, idx) => (
                                    <li key={idx} className="pl-2 border-b border-gray-300 pb-2">
                                        {note}
                                    </li>
                                ))}
                            </ul>
                        )}
                     </div>
                </Modal>
            </section>
        );
    };

    const EndScreen = ({ rank, message, onRestart }) => {
        return (
            <section id="end-screen" className="text-center pb-8 animate-fade-in">
                <h2 className="text-xl font-bold mb-4 font-mono">РЕЗУЛЬТАТ РАССЛЕДОВАНИЯ</h2>
                <div className="bg-white/50 p-6 border-2 border-[#4E6851] shadow-md">
                    <p className="text-sm font-mono">ВАШ РАНГ:</p>
                    <h3 className="text-3xl font-bold text-[#B83A2D] font-mono mb-4">{rank.toUpperCase()}</h3>
                    <p className="text-md font-mono leading-relaxed">{message}</p>
                </div>
                <div className="mt-8 mb-16">
                    <button onClick={onRestart} className="bg-[#333] text-white py-2 px-12 font-bold hover:bg-black transition-all duration-200 font-mono transform active:scale-95 shadow-lg border-2 border-transparent hover:border-gray-500">
                        НАЧАТЬ ЗАНОВО
                    </button>
                </div>

                <div className="border-t-4 border-double border-gray-400 pt-10 mt-10">
                    <h2 className="text-xl font-bold mb-8 font-mono text-[#333] uppercase tracking-widest">Автор проекта</h2>

                    <div className="max-w-sm mx-auto group bg-white p-4 border border-gray-500/20 transition-shadow duration-300">
                        <div className="w-full h-[400px] mb-4 border-2 border-black overflow-hidden bg-gray-200 relative">
                            <img
                                src="https://i.ibb.co/YF9mrYKW/photo-2025-12-24-22-59-20.jpg"
                                alt="Оля Ковальчук"
                                className="w-full h-full object-cover object-top transition-transform duration-700 group-hover:scale-105"
                            />
                        </div>

                        <h3 className="font-bold text-lg font-mono text-[#B83A2D] mb-1">E-LEARNING DEVELOPER</h3>
                        <p className="font-bold text-xl mb-3 font-mono">Оля Ковальчук</p>

                        <p className="text-sm text-left mb-6 font-mono text-gray-700 leading-relaxed border-t border-dashed border-gray-300 pt-3">
                            Создаю интерактивные форматы, которые вовлекают. Объединяю сторителлинг и практику, чтобы обучение было не только полезным, но и захватывающим.
                        </p>

                        <a
                            href="https://t.me/okcrazyart"
                            target="_blank"
                            rel="noopener noreferrer"
                            className="block w-full bg-[#B83A2D] text-white py-3 font-bold hover:bg-[#9c3025] transition-all duration-200 font-mono transform active:scale-95 shadow-md flex items-center justify-center gap-2"
                        >
                            СВЯЗАТЬСЯ СО МНОЙ
                        </a>
                    </div>
                </div>
            </section>
        );
    };

    /* ================= MAIN APP COMPONENT ================= */

    const App = () => {
        const [isLoading, setIsLoading] = useState(true);
        const [gameStage, setGameStage] = useState(GameStage.Intro);
        const [timeLeft, setTimeLeft] = useState(TOTAL_TIME);
        const [timerId, setTimerId] = useState(null);
        const [foundClues, setFoundClues] = useState(new Set());
        const [interactedHotspots, setInteractedHotspots] = useState(new Set());
        const [notebookEntries, setNotebookEntries] = useState([]);
        const [finalScore, setFinalScore] = useState(null);

        useEffect(() => {
            const imageUrls = [
                ...SUSPECTS.map(s => s.imageUrl),
                ...DESKS.map(d => d.imageUrl)
            ];

            const preloadImages = (urls) => {
                const promises = urls.map(url => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.src = url;
                        img.onload = () => resolve(true);
                        img.onerror = () => resolve(false);
                    });
                });
                return Promise.all(promises);
            };

            preloadImages(imageUrls)
                .then(() => {
                    setTimeout(() => setIsLoading(false), 500);
                })
                .catch(err => {
                    console.error("Failed to preload images", err);
                    setTimeout(() => setIsLoading(false), 500);
                });
        }, []);

        const startGame = useCallback(() => {
            setGameStage(GameStage.Dossier);
            setTimeLeft(TOTAL_TIME);
            setFoundClues(new Set());
            setInteractedHotspots(new Set());
            setNotebookEntries([]);
            setFinalScore(null);
        }, []);

        const advanceStage = useCallback((stage) => {
            setGameStage(stage);
        }, []);

        const startTimer = useCallback(() => {
            if (timerId) clearInterval(timerId);
            const newTimerId = window.setInterval(() => {
                setTimeLeft(prevTime => {
                    if (prevTime <= 1) {
                        clearInterval(newTimerId);
                        setGameStage(GameStage.End);
                        setFinalScore({ rank: 'УВОЛЕН', message: 'Время вышло. Директор в бешенстве. Вы не успели найти виновного, и база данных утекла полностью.' });
                        return 0;
                    }
                    return prevTime - 1;
                });
            }, 1000);
            setTimerId(newTimerId);
        }, [timerId]);

        const stopTimer = useCallback(() => {
            if (timerId) {
                clearInterval(timerId);
                setTimerId(null);
            }
        }, [timerId]);

        useEffect(() => {
            if (gameStage === GameStage.Search) {
                startTimer();
            } else {
                stopTimer();
            }
            return () => {
                if (timerId) clearInterval(timerId);
            };
        }, [gameStage]);

        const handleClueFound = (clueId, timeCost, hotspotId) => {
            setFoundClues(prev => new Set(prev).add(clueId));
            setTimeLeft(prev => Math.max(0, prev - timeCost));
            setInteractedHotspots(prev => new Set(prev).add(hotspotId));
        };

        const handleInteraction = (timeCost, hotspotId) => {
            setTimeLeft(prev => Math.max(0, prev - timeCost));
            setInteractedHotspots(prev => new Set(prev).add(hotspotId));
        };

        const handleNoteAdded = (note) => {
            setNotebookEntries(prev => [...prev, note]);
        };

        const handleDeduction = (culprit, method, motive) => {
            stopTimer();
            setGameStage(GameStage.End);

            const isCulpritCorrect = culprit === 'elena';
            const isMethodCorrect = method === 'phishing';
            const isMotiveCorrect = motive === 'debt';

            // Strict evidence logic for Elena
            // 1. Motive: Debt Letter
            const hasMotiveEvidence = foundClues.has(ClueId.DebtLetter);
            // 2. The Plan: Notepad Entry
            const hasPlanEvidence = foundClues.has(ClueId.NotepadEntry);
            // 3. The Weapon: Trojan Flash Drive (MUST be checked on computer, not just picked up)
            // Note: 'trojan_flash_drive' is obtained by using the flash drive, not just picking it up.
            const hasWeaponEvidence = foundClues.has(ClueId.TrojanFlashDrive);
            // 4. Intent/Blackmail: Phone Drafts OR Threatening SMS
            const hasIntentEvidence = foundClues.has(ClueId.ElenaFlipPhone) || foundClues.has(ClueId.ThreateningSMS);

            // Count how many STRONG pieces of evidence were found
            let strongEvidenceCount = 0;
            if (hasMotiveEvidence) strongEvidenceCount++;
            if (hasPlanEvidence) strongEvidenceCount++;
            if (hasWeaponEvidence) strongEvidenceCount++;
            if (hasIntentEvidence) strongEvidenceCount++;

            if (isCulpritCorrect && isMethodCorrect && isMotiveCorrect) {
                if (strongEvidenceCount === 4) {
                     setFinalScore({
                         rank: 'ЛЕГЕНДА СЫСКА',
                         message: 'Идеальное расследование! Вы нашли все ключевые улики: план в блокноте, письмо от коллекторов, черновики с угрозами и подтвердили наличие трояна на флешке. Вина Елены доказана на 100%, адвокаты бессильны. Вам выписали тройную премию.'
                     });
                } else if (strongEvidenceCount >= 2) {
                    setFinalScore({
                        rank: 'ОПЫТНЫЙ СЛЕДОВАТЕЛЬ',
                        message: 'Отличная работа. Вы верно определили преступника и мотив. У вас есть пара железных улик, но картина преступления восстановлена не полностью (возможно, вы не проверили флешку или не нашли план). Тем не менее, Елена арестована.'
                    });
                } else {
                     setFinalScore({
                         rank: 'ЧИСТАЯ ИНТУИЦИЯ',
                         message: 'Вы угадали! Елена действительно виновна, и мотив с долгами верный. Но у вас на руках почти нет твердых улик. В суде будет сложно доказать её вину без блокнота или данных с флешки. Директор рад, что крыса найдена, но просит впредь искать доказательства, а не гадать.'
                     });
                }
            } else if (isCulpritCorrect && (!isMethodCorrect || !isMotiveCorrect)) {
                 setFinalScore({
                     rank: 'СЛЕДОВАТЕЛЬ-НОВИЧОК',
                     message: 'Вы поймали нужного человека (Елену), но не смогли точно понять схему или мотив преступления. Адвокаты могут развалить дело в суде, так как вы путаетесь в показаниях. Директор смотрит на вас с сомнением.'
                 });
            } else if (culprit === 'grigory') {
                setFinalScore({
                    rank: 'ОШИБКА СЛЕДСТВИЯ',
                    message: 'Вы обвинили Григория. Да, он нарушал правила (майнинг), но он не сливал базу. Настоящий преступник (Елена) осталась на свободе и подставила сисадмина. Вы уволены за некомпетентность.'
                });
            } else if (culprit === 'mikhail') {
                 setFinalScore({
                    rank: 'ПОЗОР',
                    message: 'Вы обвинили старого бухгалтера. Михаил перепутал файлы по глупости, но злого умысла не имел. Коллектив вас ненавидит за травлю старика. Настоящий вор сбежал с деньгами.'
                });
            } else {
                 setFinalScore({
                    rank: 'ПРОВАЛ',
                    message: 'Ваша версия рассыпалась. Вы обвинили невиновных, не поняли мотивов. Директор в ярости выставил вас за дверь.'
                });
            }
        };

        const renderSection = (stage, component) => {
            return (
                <div className={`transition-opacity duration-700 opacity-100`}>
                    {component}
                </div>
            );
        };

        if (isLoading) {
            return <LoadingScreen />;
        }

        return (
            <div className="min-h-screen font-sans p-4 sm:p-8 flex items-center justify-center">
                <div className="max-w-4xl w-full mx-auto paper-texture shadow-2xl p-4 sm:p-8 border-2 border-gray-600/50 relative z-10">
                    <header className="flex justify-between items-start border-b-4 border-double border-[#4E6851] pb-4 mb-8 relative">
                        <div className="text-left">
                            <h1 className="text-3xl sm:text-4xl font-bold font-mono tracking-wider text-[#1a1a1a]">ДЕЛО №13-82</h1>
                            <p className="text-sm font-mono text-[#333]">Инцидент: УТЕЧКА БАЗЫ ДАННЫХ (КЛАСС А)</p>
                        </div>
                        <div className="absolute top-2 right-2 text-center flex flex-col items-end gap-4">
                            <div className="text-sm font-bold text-[#B83A2D] border-4 border-[#B83A2D] p-2 rotate-12 font-mono opacity-80 mix-blend-multiply">
                                КОНФИДЕНЦИАЛЬНО
                            </div>
                        </div>
                    </header>

                    <main className="space-y-12">
                        {gameStage >= GameStage.Intro && renderSection(GameStage.Intro, <IntroSection onStart={startGame} />)}

                        {gameStage >= GameStage.Dossier && (
                            <div className={`transition-all duration-700 ease-in-out ${gameStage > GameStage.Intro ? 'max-h-[2000px] opacity-100' : 'max-h-0 opacity-0'} overflow-hidden`}>
                                 {renderSection(GameStage.Dossier, <DossierSection onComplete={() => advanceStage(GameStage.Search)} />)}
                            </div>
                        )}

                        {gameStage >= GameStage.Search && (
                            <div className={`transition-all duration-700 ease-in-out ${gameStage > GameStage.Dossier ? 'max-h-[3000px] opacity-100' : 'max-h-0 opacity-0'} overflow-hidden`}>
                                 {renderSection(GameStage.Search,
                                    <SearchSection
                                        timeLeft={timeLeft}
                                        foundClues={Array.from(foundClues)}
                                        foundCluesCount={foundClues.size}
                                        onClueFound={handleClueFound}
                                        onInteraction={handleInteraction}
                                        interactedHotspots={interactedHotspots}
                                        onComplete={() => advanceStage(GameStage.Interrogation)}
                                    />
                                 )}
                            </div>
                        )}

                        {gameStage >= GameStage.Interrogation && (
                             <div className={`transition-all duration-700 ease-in-out ${gameStage > GameStage.Search ? 'max-h-[3000px] opacity-100' : 'max-h-0 opacity-0'} overflow-hidden`}>
                                {renderSection(GameStage.Interrogation,
                                    <InterrogationSection
                                        foundClues={foundClues}
                                        onNoteAdded={handleNoteAdded}
                                        onComplete={() => advanceStage(GameStage.Deduction)}
                                    />
                                )}
                            </div>
                        )}

                        {gameStage >= GameStage.Deduction && (
                            <div className={`transition-all duration-700 ease-in-out ${gameStage > GameStage.Interrogation ? 'max-h-[2000px] opacity-100' : 'max-h-0 opacity-0'} overflow-hidden`}>
                                {renderSection(GameStage.Deduction, <DeductionSection onComplete={handleDeduction} notebookEntries={notebookEntries} />)}
                            </div>
                        )}

                        {gameStage === GameStage.End && finalScore && (
                            <div className={`transition-all duration-700 ease-in-out ${gameStage === GameStage.End ? 'max-h-[2000px] opacity-100' : 'max-h-0 opacity-0'} overflow-hidden`}>
                                 <EndScreen
                                    rank={finalScore.rank}
                                    message={finalScore.message}
                                    onRestart={startGame}
                                />
                            </div>
                        )}
                    </main>
                </div>
            </div>
        );
    };

    /* ================= INDEX ================= */
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
        <React.StrictMode>
            <App />
        </React.StrictMode>
    );
    </script>
  </body>
</html>
